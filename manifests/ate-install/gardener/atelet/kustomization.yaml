# Atelet overlay for Gardener Shoot clusters.
#
# Differences from kind/atelet:
#   - No --localhost-registry-replacement (no in-cluster Docker registry on the node)
#   - Info log level (kind uses debug for CI assertion; Gardener uses info)
#   - S3/rustfs storage backend (same as kind)
#   - Prometheus port remapped from 9090 to 19090 (Cilium DaemonSet uses 9090 as
#     hostPort on all Gardener nodes; the conflict prevents atelet from scheduling)
#
# Port remapping: kustomize strategic-merge uses containerPort as the merge key for
# container ports, so patching containerPort:9090 replaces that entry in-place rather
# than appending a duplicate.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../atelet.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: atelet-${SUBSTRATE_VERSION_SUFFIX}
        namespace: ate-system
      spec:
        template:
          metadata:
            annotations:
              prometheus.io/port: "19090"
          spec:
            containers:
            - name: atelet
              args:
              - --gcp-auth-for-image-pulls=false
              - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
              - --client-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
              - --log-level=info
              env:
              - name: ATE_STORAGE_BACKEND
                value: s3
              - name: AWS_REGION
                value: us-east-1
              - name: AWS_ENDPOINT_URL
                value: http://rustfs.ate-system.svc:9000
              - name: AWS_S3_USE_PATH_STYLE
                value: "true"
              - name: AWS_ACCESS_KEY_ID
                value: rustfsadmin
              - name: AWS_SECRET_ACCESS_KEY
                value: rustfsadmin
              ports:
              - containerPort: 9090
                hostPort: 19090
                name: prometheus
                protocol: TCP

